<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fruit Ninja — Hand Tracking</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;500;600;700&display=swap');

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg-0: #090503;
    --bg-1: #130b05;
    --bg-2: #261408;
    --panel: rgba(14, 9, 5, 0.58);
    --panel-strong: rgba(12, 8, 4, 0.82);
    --line-soft: rgba(255, 220, 150, 0.16);
    --gold: #ffd972;
    --cream: #fff7ea;
    --green: #35f28a;
    --red: #ff4a4a;
    --slash: #fff8c0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(circle at top, rgba(95, 53, 24, 0.35), transparent 35%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg-0) 100%);
    font-family: 'Outfit', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  #gameWrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
  }

  #gameWrapper::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 18% 18%, rgba(255, 208, 120, 0.12), transparent 24%),
      radial-gradient(circle at 82% 20%, rgba(255, 112, 80, 0.10), transparent 24%),
      radial-gradient(circle at 50% 74%, rgba(60, 170, 255, 0.05), transparent 28%);
    pointer-events: none;
    z-index: 0;
  }

  #gameWrapper::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.03), transparent 16%, transparent 84%, rgba(0,0,0,0.22));
    pointer-events: none;
    z-index: 4;
  }

  #bgCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    filter: saturate(1.08) contrast(1.04);
  }

  #webcam {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.16;
    z-index: 1;
    display: block;
    pointer-events: none;
    visibility: hidden;
  }

  #gameCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    cursor: none;
    touch-action: none;
  }

  #hud {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  .hud-score,
  .hud-lives,
  .hud-highscore,
  #camStatus,
  #pauseBtn {
    backdrop-filter: blur(14px);
  }

  .hud-score {
    position: absolute;
    top: 18px;
    left: 22px;
    color: var(--gold);
    font-family: 'Bangers', cursive;
    text-shadow: 0 0 16px rgba(255, 201, 0, 0.28), 2px 2px 0 #000;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 18px;
    padding: 10px 16px 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
  }

  .hud-score .label {
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--cream);
    opacity: 0.72;
  }

  .hud-score .value {
    font-size: 54px;
    line-height: 0.95;
  }

  .hud-combo {
    position: absolute;
    top: 102px;
    left: 22px;
    font-family: 'Bangers', cursive;
    font-size: 22px;
    color: var(--green);
    text-shadow: 0 0 12px rgba(53, 242, 138, 0.55);
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 0.3s ease;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(12, 22, 15, 0.38);
    border: 1px solid rgba(120, 255, 170, 0.18);
  }

  .hud-combo.visible {
    opacity: 1;
  }

  .hud-lives {
    position: absolute;
    top: 18px;
    right: 22px;
    display: flex;
    gap: 8px;
    flex-direction: column;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 18px;
    padding: 10px 12px 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
  }

  .hud-lives .label {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--cream);
    opacity: 0.62;
    text-transform: uppercase;
  }

  .lives-row {
    display: flex;
    gap: 8px;
  }

  .life-icon {
    width: 28px;
    height: 28px;
    background: var(--red);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 74, 74, 0.45);
    border: 2px solid #ff6666;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .life-icon::after {
    content: '💣';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .life-icon.lost {
    background: #333;
    border-color: #555;
    box-shadow: none;
    opacity: 0.3;
  }

  .hud-highscore {
    position: absolute;
    top: 102px;
    right: 22px;
    font-family: 'Bangers', cursive;
    font-size: 17px;
    color: var(--cream);
    letter-spacing: 1px;
    text-align: right;
    opacity: 0.82;
    background: rgba(12, 9, 5, 0.34);
    border: 1px solid rgba(255, 220, 150, 0.12);
    border-radius: 999px;
    padding: 8px 14px;
    box-shadow: 0 12px 26px rgba(0,0,0,0.16);
  }

  #centerText {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 12;
    font-family: 'Bangers', cursive;
    font-size: clamp(34px, 6vw, 58px);
    letter-spacing: 2px;
    color: #fff9cc;
    text-shadow: 0 0 18px rgba(255, 210, 0, 0.45), 0 0 42px rgba(255, 80, 80, 0.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  #camStatus {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--cream);
    opacity: 0.76;
    z-index: 10;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(10, 7, 4, 0.38);
    border: 1px solid rgba(255, 220, 150, 0.14);
  }

  #camStatus span { color: var(--green); }

  #startScreen {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 60%, rgba(45,26,8,0.25) 0%, rgba(10,5,2,0.90) 100%);
    backdrop-filter: blur(10px);
  }

  .game-logo {
    font-family: 'Bangers', cursive;
    font-size: clamp(56px, 12vw, 110px);
    color: var(--gold);
    text-shadow: 0 0 24px rgba(255, 201, 0, 0.34), 4px 4px 0 #6f3600, 8px 8px 0 #341900;
    letter-spacing: 4px;
    line-height: 1;
    text-align: center;
    animation: logoPulse 2.5s ease-in-out infinite;
  }

  .game-logo span {
    color: #ff5b5b;
    text-shadow: 0 0 22px rgba(255, 60, 60, 0.35), 4px 4px 0 #880000;
  }

  @keyframes logoPulse {
    0%,100% { transform: scale(1) rotate(-1deg); }
    50% { transform: scale(1.03) rotate(1deg); }
  }

  .logo-sub {
    font-size: clamp(14px, 3vw, 20px);
    color: var(--cream);
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0.82;
    margin: 6px 0 40px;
  }

  .fruit-preview {
    font-size: 42px;
    margin-bottom: 32px;
    animation: floatFruits 3s ease-in-out infinite;
    letter-spacing: 8px;
  }

  @keyframes floatFruits {
    0%,100% { transform: translateY(0px) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }

  .btn-start,
  .btn-restart {
    font-family: 'Bangers', cursive;
    letter-spacing: 3px;
    color: var(--bg-1);
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .btn-start {
    font-size: 28px;
    padding: 16px 48px;
    box-shadow: 0 0 28px rgba(255, 170, 0, 0.28), 0 6px 0 #7a4000, 0 10px 20px rgba(0,0,0,0.45);
    transition: transform 0.15s, box-shadow 0.15s;
    pointer-events: all;
  }

  .btn-start::after,
  .btn-restart::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 10%;
    width: 80%;
    height: 40%;
    background: rgba(255,255,255,0.25);
    border-radius: 999px;
  }

  .btn-start:hover,
  .btn-restart:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 34px rgba(255, 170, 0, 0.35), 0 8px 0 #7a4000, 0 14px 24px rgba(0,0,0,0.5);
  }

  .btn-start:active,
  .btn-restart:active {
    transform: translateY(2px);
  }

  .controls-hint {
    margin-top: 28px;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--cream);
    opacity: 0.64;
    text-align: center;
    max-width: 520px;
    line-height: 1.45;
  }

  #pauseBtn {
    position: absolute;
    bottom: 16px;
    right: 22px;
    z-index: 10;
    background: var(--panel);
    border: 1px solid rgba(255,200,0,0.22);
    color: var(--gold);
    font-family: 'Bangers', cursive;
    font-size: 15px;
    letter-spacing: 2px;
    padding: 8px 18px;
    border-radius: 30px;
    cursor: pointer;
    display: none;
    transition: background 0.2s, transform 0.2s;
  }

  #pauseBtn:hover {
    background: rgba(255,200,0,0.14);
    transform: translateY(-1px);
  }

  #gameOverScreen {
    position: absolute;
    inset: 0;
    z-index: 25;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .go-panel {
    background: linear-gradient(160deg, rgba(26,10,0,0.94), rgba(10,5,2,0.78));
    border: 1px solid rgba(255,140,0,0.3);
    border-radius: 24px;
    padding: 44px 56px;
    text-align: center;
    box-shadow: 0 16px 50px rgba(0,0,0,0.45), 0 0 40px rgba(255, 80, 0, 0.12);
    backdrop-filter: blur(16px);
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 420px;
    width: 90%;
  }

  @keyframes popIn {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .go-title {
    font-family: 'Bangers', cursive;
    font-size: 66px;
    color: var(--red);
    text-shadow: 0 0 20px rgba(255, 80, 80, 0.35), 3px 3px 0 #660000;
    letter-spacing: 4px;
    line-height: 1;
    animation: redPulse 1s ease-in-out infinite;
  }

  @keyframes redPulse {
    0%,100% { text-shadow: 0 0 20px rgba(255, 80, 80, 0.35), 3px 3px 0 #660000; }
    50% { text-shadow: 0 0 40px rgba(255, 40, 40, 0.78), 3px 3px 0 #660000; }
  }

  .go-score-label {
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--cream);
    opacity: 0.55;
    margin: 20px 0 4px;
    text-transform: uppercase;
  }

  .go-score {
    font-family: 'Bangers', cursive;
    font-size: 64px;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(255, 204, 0, 0.33);
    line-height: 1;
  }

  .go-highscore {
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--green);
    margin: 8px 0 28px;
    text-shadow: 0 0 8px rgba(53, 242, 138, 0.35);
  }

  .btn-restart {
    font-size: 22px;
    padding: 12px 38px;
    box-shadow: 0 0 20px rgba(255, 170, 0, 0.18), 0 4px 0 #7a4000;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  #pauseScreen {
    position: absolute;
    inset: 0;
    z-index: 24;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.52);
    backdrop-filter: blur(12px);
  }

  .pause-panel {
    font-family: 'Bangers', cursive;
    font-size: 72px;
    color: var(--gold);
    text-shadow: 0 0 28px rgba(255, 204, 0, 0.35), 4px 4px 0 #7a3d00;
    letter-spacing: 8px;
    animation: breathe 2s ease-in-out infinite;
  }

  @keyframes breathe {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(0.97); }
  }

  .combo-float {
    position: absolute;
    font-family: 'Bangers', cursive;
    pointer-events: none;
    z-index: 15;
    text-shadow: 0 0 12px currentColor;
    animation: floatUp 1.2s ease-out forwards;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    60% { opacity: 1; transform: translateY(-60px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-100px) scale(0.8); }
  }

  @media (max-width: 900px) {
    .hud-score { top: 12px; left: 12px; }
    .hud-score .label { font-size: 11px; letter-spacing: 2px; }
    .hud-score .value { font-size: 38px; }
    .hud-combo { top: 92px; left: 12px; font-size: 18px; }
    .hud-lives { top: 12px; right: 12px; }
    .hud-highscore { top: 92px; right: 12px; font-size: 13px; }
    #camStatus { bottom: max(12px, env(safe-area-inset-bottom)); font-size: 11px; letter-spacing: 1px; width: calc(100% - 24px); text-align: center; }
    #pauseBtn { bottom: max(12px, env(safe-area-inset-bottom)); right: 12px; font-size: 13px; padding: 8px 14px; }
    .go-panel { padding: 32px 22px; }
    .go-title { font-size: 52px; }
    .go-score { font-size: 54px; }
    .pause-panel { font-size: 52px; letter-spacing: 6px; }
    .game-logo { font-size: clamp(48px, 16vw, 92px); }
    .logo-sub { letter-spacing: 4px; margin-bottom: 28px; }
    .fruit-preview { font-size: 34px; margin-bottom: 24px; }
    .btn-start { font-size: 22px; padding: 14px 34px; }
    .controls-hint { font-size: 11px; letter-spacing: 1px; padding: 0 18px; }
  }

  @media (max-width: 520px) {
    .hud-score .value { font-size: 32px; }
    .life-icon { width: 24px; height: 24px; }
    .life-icon::after { font-size: 12px; }
    .go-panel { width: 92%; }
    .btn-restart { font-size: 19px; padding: 11px 30px; }
    #pauseBtn { font-size: 12px; }
  }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="bgCanvas"></canvas>
  <video id="webcam" autoplay muted playsinline></video>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-score">
      <div class="label">SCORE</div>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="hud-combo" id="comboHud"></div>
    <div class="hud-lives">
      <div class="label">Lives</div>
      <div class="lives-row" id="livesRow"></div>
    </div>
    <div class="hud-highscore" id="highscoreHud">BEST: 0</div>
  </div>

  <div id="centerText"></div>

  <div id="camStatus">Camera: <span id="camStatusText">Initializing…</span></div>
  <button id="pauseBtn">⏸ PAUSE</button>

  <div id="startScreen">
    <div class="game-logo">FRUIT<br><span>NINJA</span></div>
    <div class="logo-sub">Hand Tracking Edition</div>
    <div class="fruit-preview">🍎 🍊 🍉 🍍 🍓</div>
    <button class="btn-start" id="startBtn">SLICE &amp; DICE</button>
    <div class="controls-hint">
      Wave your index finger to slice · Avoid 💣 bombs<br />
      Allow camera access when prompted
    </div>
  </div>

  <div id="gameOverScreen">
    <div class="go-panel">
      <div class="go-title">GAME<br>OVER</div>
      <div class="go-score-label">YOUR SCORE</div>
      <div class="go-score" id="goScore">0</div>
      <div class="go-highscore" id="goHighscore"></div>
      <button class="btn-restart" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <div id="pauseScreen">
    <div class="pause-panel">PAUSED</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const gameCanvas = document.getElementById('gameCanvas');
const ctx = gameCanvas.getContext('2d');
const webcam = document.getElementById('webcam');

ctx.imageSmoothingEnabled = true;
bgCtx.imageSmoothingEnabled = true;

const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const pauseScreen = document.getElementById('pauseScreen');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');
const scoreDisplay = document.getElementById('scoreDisplay');
const comboHud = document.getElementById('comboHud');
const livesRow = document.getElementById('livesRow');
const highscoreHud = document.getElementById('highscoreHud');
const goScore = document.getElementById('goScore');
const goHighscore = document.getElementById('goHighscore');
const camStatusText = document.getElementById('camStatusText');
const centerText = document.getElementById('centerText');

const FRUITS = [
  { emoji: '🍎', color: '#e63939', juice: '#ff6666', r: 34 },
  { emoji: '🍊', color: '#ff8c00', juice: '#ffbb44', r: 32 },
  { emoji: '🍉', color: '#33cc44', juice: '#ff4455', r: 42 },
  { emoji: '🍍', color: '#ddcc00', juice: '#ffee44', r: 36 },
  { emoji: '🍓', color: '#cc2244', juice: '#ff5577', r: 28 },
  { emoji: '🥝', color: '#5aa832', juice: '#aadd44', r: 28 },
];

const MAX_LIVES = 3;
const TRAIL_LIFE = 280;
const HIGH_SCORE_KEY = 'fnhs';
const GRAVITY = 0.38;

let width = 0;
let height = 0;
let score = 0;
let lives = MAX_LIVES;
let combo = 0;
let highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0', 10);
let gameRunning = false;
let paused = false;
let lastTime = 0;
let spawnTimer = 0;
let spawnInterval = 900;
let gameTime = 0;
let animationFrameId = 0;
let cameraStarted = false;
let hands = null;
let camera = null;
let mouseFallbackActive = false;
let finger = null;
let smoothFinger = null;
let handTrail = [];
let fruits = [];
let particles = [];
let comboTimer = null;
let shakeFrames = 0;
let shakeStrength = 0;

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;

  gameCanvas.width = bgCanvas.width = Math.round(width * dpr);
  gameCanvas.height = bgCanvas.height = Math.round(height * dpr);
  gameCanvas.style.width = bgCanvas.style.width = width + 'px';
  gameCanvas.style.height = bgCanvas.style.height = height + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBackground();
}

function drawBackground() {
  bgCtx.clearRect(0, 0, width, height);
  const grad = bgCtx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, '#28170a');
  grad.addColorStop(0.55, '#130b05');
  grad.addColorStop(1, '#070402');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, width, height);

  const glow = bgCtx.createRadialGradient(width * 0.5, height * 0.35, 0, width * 0.5, height * 0.4, Math.max(width, height) * 0.75);
  glow.addColorStop(0, 'rgba(255, 190, 120, 0.12)');
  glow.addColorStop(0.4, 'rgba(255, 120, 50, 0.06)');
  glow.addColorStop(1, 'transparent');
  bgCtx.fillStyle = glow;
  bgCtx.fillRect(0, 0, width, height);

  bgCtx.save();
  bgCtx.globalAlpha = 0.06;
  bgCtx.strokeStyle = '#ffcc88';
  for (let i = 0; i < 24; i++) {
    const y = (height / 24) * i + Math.sin(i * 1.25) * 8;
    bgCtx.beginPath();
    bgCtx.moveTo(0, y);
    for (let x = 0; x <= width; x += 70) {
      bgCtx.lineTo(x, y + (Math.random() - 0.5) * 6);
    }
    bgCtx.stroke();
  }
  bgCtx.restore();
}

function renderLives() {
  livesRow.innerHTML = '';
  for (let i = 0; i < MAX_LIVES; i++) {
    const dot = document.createElement('div');
    dot.className = 'life-icon' + (i >= lives ? ' lost' : '');
    livesRow.appendChild(dot);
  }
}

function updateComboHud() {
  comboHud.textContent = combo >= 2 ? combo + 'x COMBO' : '';
  comboHud.classList.toggle('visible', combo >= 2);
}

function showText(text) {
  centerText.textContent = text;
  centerText.style.opacity = '1';
  setTimeout(() => {
    centerText.style.opacity = '0';
  }, 500);
}

function shakeScreen() {
  document.body.style.transform = 'translate(8px)';
  setTimeout(() => {
    document.body.style.transform = 'translate(0px)';
  }, 100);
}

function spawnFruit(isBomb = false) {
  const margin = 80;
  const def = FRUITS[Math.floor(Math.random() * FRUITS.length)];
  const x = margin + Math.random() * Math.max(0, width - margin * 2);
  // Launch hard enough to arc into the upper playfield (62%–84% of the
  // screen height), regardless of viewport size. The fruit starts 80px
  // below the bottom edge, so include that in the target rise. Peak rise
  // for projectile motion is v² / (2·g), so solve for the needed speed.
  const targetRise = height * (0.62 + Math.random() * 0.22) + 80;
  const launchSpeed = Math.sqrt(2 * GRAVITY * targetRise);
  // Gentle pull back toward centre so edge fruits don't drift off-screen
  // during the now-longer airtime.
  const inwardBias = ((width / 2 - x) / width) * 4;
  return {
    x,
    y: height + 80,
    speedX: inwardBias + (Math.random() - 0.5) * 4,
    speedY: -launchSpeed,
    radius: isBomb ? 30 : 40 + Math.random() * 20,
    rotation: Math.random() * 360,
    rotSpeed: (Math.random() - 0.5) * 3,
    def,
    type: isBomb ? '💣' : def.emoji,
    isBomb,
    cut: false,
  };
}

function spawnWave() {
  const count = 1 + Math.floor(Math.random() * 3);
  const bombChance = Math.min(0.15 + gameTime / 60000 * 0.15, 0.35);
  for (let i = 0; i < count; i++) {
    const fruit = spawnFruit(Math.random() < bombChance);
    fruit.x += (i - (count - 1) / 2) * 70;
    fruits.push(fruit);
  }
}

function pointCircleIntersect(px, py, cx, cy, radius) {
  return Math.hypot(px - cx, py - cy) <= radius;
}

function segmentCircleIntersect(ax, ay, bx, by, cx, cy, radius) {
  const dx = bx - ax;
  const dy = by - ay;
  const fx = ax - cx;
  const fy = ay - cy;
  const a = dx * dx + dy * dy;
  const b = 2 * (fx * dx + fy * dy);
  const c = fx * fx + fy * fy - radius * radius;
  let disc = b * b - 4 * a * c;
  if (disc < 0) return false;
  disc = Math.sqrt(disc);
  const t1 = (-b - disc) / (2 * a);
  const t2 = (-b + disc) / (2 * a);
  return (t1 >= 0 && t1 <= 1) || (t2 >= 0 && t2 <= 1);
}

function spawnJuice(x, y, color, count = 14) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      r: 3 + Math.random() * 5,
      color,
    });
  }
}

function spawnExplosion(x, y) {
  for (let i = 0; i < 24; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 10;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      life: 1,
      decay: 0.018 + Math.random() * 0.025,
      r: 4 + Math.random() * 8,
      color: Math.random() < 0.5 ? '#ff4400' : '#ffcc00',
    });
  }
}

function spawnComboFloat(x, y, text, color) {
  const el = document.createElement('div');
  el.className = 'combo-float';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.fontSize = '28px';
  el.style.color = color;
  document.getElementById('gameWrapper').appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function registerHandPoint(x, y) {
  handTrail.push({ x, y, t: performance.now() });
  if (handTrail.length > 8) handTrail.shift();
  checkSlice();
}

function checkSlice() {
  if (handTrail.length < 2) return;
  const recent = handTrail.slice(-5);

  for (let s = 1; s < recent.length; s++) {
    const ax = recent[s - 1].x;
    const ay = recent[s - 1].y;
    const bx = recent[s].x;
    const by = recent[s].y;
    const speed = Math.hypot(bx - ax, by - ay);
    if (speed < 12) continue;

    for (let i = fruits.length - 1; i >= 0; i--) {
      const fruit = fruits[i];
      if (fruit.cut) continue;
      const hitRadius = fruit.radius * 0.95;
      if (segmentCircleIntersect(ax, ay, bx, by, fruit.x, fruit.y, hitRadius) || pointCircleIntersect(bx, by, fruit.x, fruit.y, hitRadius)) {
        sliceFruit(fruit, i);
        break;
      }
    }
  }
}

function sliceFruit(fruit, index) {
  fruit.cut = true;
  fruits.splice(index, 1);

  if (fruit.isBomb) {
    lives--;
    renderLives();
    score = Math.max(0, score - 10);
    scoreDisplay.textContent = score;
    combo = 0;
    updateComboHud();
    spawnExplosion(fruit.x, fruit.y);
    spawnComboFloat(fruit.x, fruit.y - 50, '-10', '#ff4444');
    showText('BOOM');
    shakeFrames = 18;
    shakeStrength = 14;
    shakeScreen();
    if (lives <= 0) {
      endGame();
    }
    return;
  }

  combo++;
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => {
    combo = 0;
    updateComboHud();
  }, 1200);
  updateComboHud();

  const points = 5 + (combo > 2 ? (combo - 2) * 3 : 0);
  score += points;
  scoreDisplay.textContent = score;
  spawnJuice(fruit.x, fruit.y, fruit.def.juice);
  spawnComboFloat(fruit.x, fruit.y - 35, '+' + points, '#ccffcc');
  showText('+' + points);

  if (combo >= 2) {
    spawnComboFloat(fruit.x, fruit.y - 60, combo + 'x COMBO', combo >= 4 ? '#ff8800' : '#ffdd00');
  }
}

function startGame() {
  score = 0;
  lives = MAX_LIVES;
  combo = 0;
  gameTime = 0;
  spawnTimer = 0;
  spawnInterval = 900;
  fruits = [];
  particles = [];
  handTrail = [];
  finger = null;
  smoothFinger = null;
  clearTimeout(comboTimer);

  scoreDisplay.textContent = '0';
  renderLives();
  updateComboHud();
  highscoreHud.textContent = 'BEST: ' + highScore;
  goScore.textContent = '0';
  gameOverScreen.style.display = 'none';
  pauseScreen.style.display = 'none';
  startScreen.style.display = 'none';
  pauseBtn.style.display = 'block';
  pauseBtn.textContent = '⏸ PAUSE';
  gameRunning = true;
  paused = false;
  lastTime = performance.now();

  if (!cameraStarted) {
    void initMediaPipe();
  }

  cancelAnimationFrame(animationFrameId);
  animationFrameId = requestAnimationFrame(loop);
}

function endGame() {
  gameRunning = false;
  pauseBtn.style.display = 'none';
  if (score > highScore) {
    highScore = score;
    localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
    goHighscore.textContent = 'NEW HIGH SCORE!';
  } else {
    goHighscore.textContent = 'Best: ' + highScore;
  }
  goScore.textContent = score;
  gameOverScreen.style.display = 'flex';
}

function loop(ts) {
  if (!gameRunning) return;
  if (paused) {
    animationFrameId = requestAnimationFrame(loop);
    return;
  }

  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  gameTime += dt;
  spawnInterval = Math.max(700, 900 - gameTime / 1000 * 6);

  spawnTimer += dt;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnWave();
  }

  const gravity = GRAVITY;
  for (const fruit of fruits) {
    fruit.speedY += gravity;
    fruit.x += fruit.speedX;
    fruit.y += fruit.speedY;
    fruit.rotation += fruit.rotSpeed;
  }
  for (const particle of particles) {
    particle.vy += gravity * 0.6;
    particle.x += particle.vx;
    particle.y += particle.vy;
    particle.vx *= 0.96;
    particle.life -= particle.decay;
  }

  fruits = fruits.filter(fruit => fruit.y < height + 120);
  particles = particles.filter(particle => particle.life > 0);
  handTrail = handTrail.filter(point => performance.now() - point.t < TRAIL_LIFE);

  draw(ts);
  animationFrameId = requestAnimationFrame(loop);
}

function draw(ts) {
  ctx.clearRect(0, 0, width, height);
  ctx.save();

  if (shakeFrames > 0) {
    shakeFrames--;
    ctx.translate((Math.random() - 0.5) * shakeStrength, (Math.random() - 0.5) * shakeStrength);
    shakeStrength *= 0.88;
  }

  for (const particle of particles) {
    ctx.save();
    ctx.globalAlpha = particle.life;
    ctx.beginPath();
    ctx.arc(particle.x, particle.y, particle.r, 0, Math.PI * 2);
    ctx.fillStyle = particle.color;
    ctx.shadowColor = particle.color;
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.restore();
  }

  for (const fruit of fruits) {
    ctx.save();
    ctx.translate(fruit.x, fruit.y);
    ctx.rotate(fruit.rotation * Math.PI / 180);
    if (fruit.isBomb) {
      drawBomb(fruit);
    } else {
      drawFruit(fruit);
    }
    ctx.restore();
  }

  drawTrail();

  if (finger && gameRunning) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(finger.x, finger.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,200,0.25)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(finger.x, finger.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffa0';
    ctx.shadowColor = '#ffee00';
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

function drawFruit(fruit) {
  const r = fruit.radius;
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.beginPath();
  ctx.ellipse(2, r * 0.7, r * 0.8, r * 0.25, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();

  const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  grad.addColorStop(0, 'rgba(255,255,255,0.32)');
  grad.addColorStop(0.3, fruit.def.color);
  grad.addColorStop(1, shadeColor(fruit.def.color, -40));
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.shadowColor = fruit.def.color;
  ctx.shadowBlur = 8;
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.font = r * 1.15 + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(fruit.def.emoji, 0, 0);
}

function drawBomb(fruit) {
  const r = fruit.radius;
  const pulse = 0.85 + Math.sin(performance.now() / 120) * 0.15;
  ctx.beginPath();
  ctx.arc(0, 0, r * pulse, 0, Math.PI * 2);
  const bg = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  bg.addColorStop(0, '#555');
  bg.addColorStop(0.5, '#222');
  bg.addColorStop(1, '#000');
  ctx.fillStyle = bg;
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 18;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.font = r * 1.15 + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💣', 0, 0);
}

function drawTrail() {
  if (handTrail.length < 2) return;
  const now = performance.now();
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 1; i < handTrail.length; i++) {
    const p0 = handTrail[i - 1];
    const p1 = handTrail[i];
    const age = (now - p1.t) / TRAIL_LIFE;
    const alpha = Math.max(0, 1 - age);
    const widthValue = Math.max(1, (1 - age) * 18);
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineWidth = widthValue;
    ctx.strokeStyle = 'rgba(255,248,180,' + alpha * 0.85 + ')';
    ctx.shadowColor = '#ffee44';
    ctx.shadowBlur = 22 * alpha;
    ctx.stroke();
    ctx.lineWidth = widthValue * 0.25;
    ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
    ctx.shadowBlur = 8;
    ctx.stroke();
  }
  ctx.restore();
}

function shadeColor(hex, amount) {
  const numeric = parseInt(hex.slice(1), 16);
  const red = Math.max(0, Math.min(255, ((numeric >> 16) & 255) + amount));
  const green = Math.max(0, Math.min(255, ((numeric >> 8) & 255) + amount));
  const blue = Math.max(0, Math.min(255, (numeric & 255) + amount));
  return 'rgb(' + red + ',' + green + ',' + blue + ')';
}

async function initMediaPipe() {
  if (cameraStarted) return;
  if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
    camStatusText.textContent = 'Touch/Mouse mode';
    setupMouseFallback();
    return;
  }

  hands = new Hands({
    locateFile: file => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + file,
  });
  hands.setOptions({
    maxNumHands: 1,
    // Lite model (0) infers several times faster than the full model (1),
    // which is the main cause of the tracking lag.
    modelComplexity: 0,
    minDetectionConfidence: 0.6,
    // Lower tracking threshold keeps the hand locked frame-to-frame instead
    // of re-running the slower detector, which smooths out the motion.
    minTrackingConfidence: 0.5,
  });
  hands.onResults(onHandResults);

  camera = new Camera(webcam, {
    onFrame: async () => {
      if (gameRunning && !paused) {
        await hands.send({ image: webcam });
      }
    },
    // Fewer pixels per frame = faster inference. A single fingertip does not
    // need 640×480.
    width: 480,
    height: 360,
  });

  try {
    camStatusText.textContent = 'Starting...';
    await camera.start();
    cameraStarted = true;
    camStatusText.textContent = 'Active';
  } catch (error) {
    camStatusText.textContent = 'Touch/Mouse mode';
    setupMouseFallback();
  }
}

function onHandResults(results) {
  if (!gameRunning || paused) return;
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const fingerTip = results.multiHandLandmarks[0][8];
    const targetX = width - (fingerTip.x * width);
    const targetY = fingerTip.y * height;

    if (!smoothFinger) {
      smoothFinger = { x: targetX, y: targetY, px: targetX, py: targetY };
    }

    // Detection always lags the real hand by a frame or two. Estimate the
    // fingertip's velocity from the last raw reading and extrapolate slightly
    // ahead so the cursor catches up instead of trailing behind.
    const vx = targetX - smoothFinger.px;
    const vy = targetY - smoothFinger.py;
    smoothFinger.px = targetX;
    smoothFinger.py = targetY;
    const predX = targetX + vx * 0.5;
    const predY = targetY + vy * 0.5;

    // Snappier follow (0.7) than before (0.5): less smoothing lag, while the
    // prediction above keeps it from getting jittery.
    smoothFinger.x += (predX - smoothFinger.x) * 0.7;
    smoothFinger.y += (predY - smoothFinger.y) * 0.7;

    finger = { x: smoothFinger.x, y: smoothFinger.y };
    registerHandPoint(finger.x, finger.y);
  }
}

function setupMouseFallback() {
  if (mouseFallbackActive) return;
  mouseFallbackActive = true;

  const updateFromPointer = event => {
    if (!gameRunning || paused) return;
    const rect = gameCanvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    if (!smoothFinger) smoothFinger = { x, y };
    smoothFinger.x += (x - smoothFinger.x) * 0.6;
    smoothFinger.y += (y - smoothFinger.y) * 0.6;
    finger = { x: smoothFinger.x, y: smoothFinger.y };
    registerHandPoint(finger.x, finger.y);
  };

  gameCanvas.addEventListener('pointerdown', event => {
    gameCanvas.setPointerCapture(event.pointerId);
    updateFromPointer(event);
  });
  gameCanvas.addEventListener('pointermove', updateFromPointer);
  gameCanvas.addEventListener('pointerup', () => {});
  gameCanvas.addEventListener('pointercancel', () => {});
  camStatusText.textContent = 'Touch/Mouse mode';
}

startBtn.addEventListener('click', () => {
  void initMediaPipe();
  startGame();
});

restartBtn.addEventListener('click', () => {
  startGame();
});

pauseBtn.addEventListener('click', () => {
  if (!gameRunning) return;
  paused = !paused;
  pauseScreen.style.display = paused ? 'flex' : 'none';
  pauseBtn.textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
  if (!paused) {
    lastTime = performance.now();
  }
});

document.addEventListener('keydown', event => {
  if ((event.code === 'Space' || event.code === 'KeyP') && gameRunning) {
    paused = !paused;
    pauseScreen.style.display = paused ? 'flex' : 'none';
    pauseBtn.textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
    if (!paused) {
      lastTime = performance.now();
    }
  }
});

window.addEventListener('resize', resize);

renderLives();
highscoreHud.textContent = 'BEST: ' + highScore;
resize();
</script>
</body>
</html>
